name: CI

# Trigger on pushes to main and any pull request
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel in-progress runs if a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Run Quality Gates
    runs-on: ubuntu-latest
    
    # We test on Python 3.12 as specified in pyproject.toml
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip' # Speeds up builds by caching dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the project and all development/testing dependencies
          pip install -e ".[dev]"

      - name: Check code formatting with Black
        # The --check flag fails the step if files would be modified
        run: black --check src tests

      - name: Lint with Ruff
        # Fails on any warning or error, following pyproject.toml configuration
        run: ruff check src tests

      - name: Type check with mypy
        # Fails if static type checks fail
        run: mypy src tests

      - name: Run tests with pytest & coverage
        # Runs the test suite and enforces fail_under=80 as configured in pyproject.toml
        # It also generates the htmlcov/ directory as per the config
        run: |
          pytest

      - name: Upload coverage report artifact
        # Uploads the HTML coverage report so it can be viewed directly from the GitHub Actions UI
        uses: actions/upload-artifact@v4
        if: always() # Upload even if tests fail, to see what was covered
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14
